# Railway — Backend de Produção do CEO (BP-001)
# Deploy a partir do diretório `server/` (Root Directory = server).
#
# Identificação de versão: a plataforma injecta RAILWAY_GIT_COMMIT_SHA
# em deploys via GitHub. O /health expõe `commit` (short SHA) a partir dessa
# variável (ou CEO_GIT_COMMIT / git local) — sem SHA fixo no código.

[deploy]
startCommand = "npm start"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
