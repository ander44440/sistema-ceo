# Railway — Backend de Producao do CEO (BP-001)
#
# Deploy GitHub monorepo (Opcao A / CAP-13): fonte de verdade = `/railway.toml`
# na raiz do repositorio (Root Directory = `.`, install/start com `--prefix server`).
#
# Este ficheiro mantem o perfil CLI `railway up server --path-as-root`
# (restauro operacional / lab), para o servico nao ficar sem startCommand.

[deploy]
startCommand = "npm start"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
