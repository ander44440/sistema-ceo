# Railway — ceo-api (CAP-13 packaging Opção C / Dockerfile)
# Root Directory do serviço: repositório raiz (`.`).
# Processo executável: server/ (Hono). MEP canónico: app/src/mepCeo (sem cópia).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["server/**", "app/src/mepCeo/**", "Dockerfile", ".dockerignore"]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
